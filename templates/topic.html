{% extends 'base.html' %}

{% block content %}
  <h2>{{ topic }}</h2>
  <div class="mb-3 quote">{{ quote }}</div>
  {% if results %}
    <div class="card p-3 mb-3">{{ results }}</div>
  {% endif %}

  {% if books %}
    <h4>Books</h4>
    <div class="row">
      {% for b in books %}
      <div class="col-md-3 mb-3">
        <div class="card h-100">
          {% if b.cover_id %}
          <img src="https://covers.openlibrary.org/b/id/{{ b.cover_id }}-M.jpg" class="card-img-top" alt="{{ b.title }}">
          {% endif %}
          <div class="card-body">
            <h6 class="card-title">{{ b.title }}</h6>
            <p class="card-text"><small class="text-muted">{{ b.author }}</small></p>
          </div>
        </div>
      </div>
      {% endfor %}
    </div>
  {% endif %}

{% endblock %}
